#cloud-config
# First boot of the podcast server (Ubuntu 24.04 Minimal on Oracle Cloud). ops/oci/provision.sh
# embeds ops/Caddyfile into this file before launch (the CADDYFILE marker below).
# What it does: Caddy from its official apt repo; ports 80/443 opened in the OS firewall
# (Oracle's Ubuntu images reject everything but 22 there, on top of the cloud security list);
# the two show folders owned by `ubuntu` for rsync; Caddy enabled with our Caddyfile.
package_update: true
package_upgrade: false
packages:
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
  - rsync
  - iptables-persistent
write_files:
  - path: /etc/caddy/Caddyfile.podcast
    permissions: "0644"
    content: |
#CADDYFILE#
runcmd:
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save
  - mkdir -p /var/www/podcast/age-of-abundance/media /var/www/podcast/unfinished-cubby/media
  - chown -R ubuntu:ubuntu /var/www/podcast
  - cp /etc/caddy/Caddyfile.podcast /etc/caddy/Caddyfile
  - systemctl enable --now caddy
  - systemctl reload caddy
  - touch /var/www/podcast/.cloud-init-done
